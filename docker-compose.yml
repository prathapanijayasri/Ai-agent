version: '3.8'

services:
  medibot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medibot-healthcare-assistant
    ports:
      - "5000:5000"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=False
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - KNOWLEDGE_BASE_DIR=/app/knowledge_base
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
    volumes:
      # Persistent storage for ChromaDB index so embeddings persist across restarts
      - chroma_data:/app/chroma_db
      - ./backend/uploads:/app/backend/uploads
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
